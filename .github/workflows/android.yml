# Builds the signed Android APK and publishes it as a GitHub release
# whenever a version tag (v0.1.0, v0.2.3, …) is pushed.
#
# To release: bump "version" in mobile/package.json, commit, then push an
# annotated tag with the release notes as its message:
#   git tag -a v0.1.0 -m "What's new…"
#   git push origin v0.1.0
#
# The signing key comes from these repository secrets (Settings → Secrets
# and variables → Actions); it never touches the repo:
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Actions are pinned to commits, so a moved tag can't change what runs.

name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match mobile/package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Install
        run: npm ci

      - name: Build the app's web layer
        run: npm run build -w mobile

      - name: Copy it into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build the signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Name the APK and its checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="goontally-${VERSION}.apk"
          mv mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Fails the release if the APK isn't signed (e.g. a secret is missing).
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs "$apk" | head -n 3
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Goontally ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            goontally-${{ steps.version.outputs.version }}.apk
            goontally-${{ steps.version.outputs.version }}.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
